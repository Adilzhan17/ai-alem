version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Perricheno2.7
      POSTGRES_DB: main_db
    ports:
      - "5435:5432" # Mapped to 5435 to avoid conflict with existing services on 5432/5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://admin:Perricheno2.7@db:5432/main_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "8090:80" # Exposed on port 8090
    volumes:
      - ./uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend

volumes:
  postgres_data:
